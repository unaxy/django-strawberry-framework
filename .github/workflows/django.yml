name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 05:41 UTC every Monday: the full matrix with no commit. The newest Django
    # patch releases install on every run, and a patch release can change what
    # the version-audited SQLCompiler table depends on while this repository
    # stays still; the weekly run reports that drift within a week, apart from
    # any commit. An off-the-hour minute avoids the top-of-hour scheduling queue.
    - cron: "41 5 * * 1"

# Least privilege by default: every job in this workflow reads the repository and
# nothing more. A job that genuinely needs a wider scope re-declares `permissions`
# at the job level, which REPLACES this block rather than adding to it -- so the
# grant stays visible next to the step that consumes it (spec-049 Decision 3).
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so the checkout credential has no consumer.
          # Leaving it persisted in .git/config would expose it to every later
          # step (including the linters' own dependency tree).
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct cache namespace per setup-uv job: lint / test / pages otherwise
          # share one key on Python 3.12.3 + the same uv.lock and race to save it
          # (and overwrite each other's pruned cache content).
          cache-suffix: lint
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Type check (basedpyright)
        # `[tool.basedpyright]` in pyproject.toml owns the scope (every Python file
        # but the git-ignored scratch trees), the Python it
        # checks against (the lowest its stubs support; the floor cells prove the
        # package's own floor) and the strictness rules, with warnings failing the
        # run; it never imports the fakeshop settings.
        run: uv run basedpyright
      - name: Type check at the Python floor (basedpyright, 3.10)
        # pyrightconfig.floor.json extends `[tool.basedpyright]` and re-checks its whole
        # scope at the `requires-python` floor, so a 3.11+ stdlib or `typing` name
        # fails here when it is written rather than when a floor-cell test reaches it.
        # The unneeded-suppression rule is off: a suppression the 3.11 pass needs may be
        # moot at 3.10, and that pass already gates it.
        run: uv run basedpyright -p pyrightconfig.floor.json
      - name: Locked type suppressions
        # No `# pyright: ignore[...]` may name a rule pyproject.toml marks `# Locked`, no
        # file-level `# pyright:` directive may lower a rule (pyproject.toml owns rule levels),
        # and every site's casts and ignores match scripts/type_suppressions.toml.
        run: uv run python scripts/check_type_suppressions.py
      - name: Public API type completeness (basedpyright --verifytypes)
        # Installs the package non-editable in a temporary environment and
        # requires a 100% score with no diagnostic outside the script's exact-match
        # allowlist (scripts/check_public_types.py).
        run: uv run python scripts/check_public_types.py
      - name: Source layout (trailing commas, md link scaffold, JSON/GraphQL braces, ASCII-only)
        run: uv run python scripts/check_trailing_commas.py --check

      - name: Truthful identity reads
        # Identity facts about consumer objects are read through
        # django_strawberry_framework/utils/truth.py, never by dunder lookup,
        # and no handler swallows BaseException. The `truthful-reads`
        # pre-commit hook runs the same gate; this step is the backstop for
        # commits made with hooks skipped.
        run: uv run python scripts/check_truthful_reads.py --check

      - name: Citations resolve (AGENTS.md source-refs rule, path::Symbol refs)
        # Every `path.py::Symbol` reference in first-party source must name a file
        # that exists and a symbol that file still defines; on the board and in the
        # spec corpus (docs/spec-*.md, docs/SPECS/**/*.md) a cited file that exists
        # must still define the symbol, and every `#"substring"` pinpoint's text must
        # still occur in what it cites. The `check-citations` pre-commit hook runs
        # the same sweep on every commit; this step is the backstop for commits made
        # with hooks skipped.
        run: uv run python scripts/check_citations.py --check --substrings

      - name: Kanban tracked-path constants
        # Parity with the `kanban-tracked-path-constants` pre-commit hook, which
        # REWRITES the constants module rather than reporting on it. A commit
        # that adds or removes a tracked package/test path without regenerating
        # leaves the module stale on main, and the next contributor's hook then
        # fails on a diff they did not create. Enforcing the same invariant on
        # push keeps that cost on the commit that caused it.
        run: uv run python scripts/build_kanban_tracked_path_constants.py --check

      - name: Kanban anchors collision-free
        # Parity with the `check-kanban-anchors` pre-commit hook: the backstop for
        # a card retitle committed with hooks skipped. Reads the committed board and
        # glossary DB; writes nothing.
        run: uv run python scripts/check_kanban_anchors.py

      - name: Done-card glossary rows equal their spec terms CSVs
        # Parity with the `import-spec-terms-check` pre-commit hook: the backstop for
        # a terms-CSV edit or spec archive committed without the writing
        # `manage.py import_spec_terms`. Names every row the writing run would
        # change; reads the committed DB and CSVs, writes nothing.
        run: uv run python examples/fakeshop/manage.py import_spec_terms --check --skip-checks

      - name: Every spec's terms CSV matches the glossary and its spec links
        # Parity with the `check-spec-glossaries` pre-commit hook: the backstop for
        # a glossary heading rename or a dropped spec link committed with hooks
        # skipped. Runs `scripts/check_spec_glossary.py` over every spec and its
        # terms CSV and fails on a terms CSV no spec owns; writes nothing.
        run: uv run python scripts/check_all_spec_glossaries.py

      - name: Generated docs match their generators
        # Every one of these files is script-rendered from the fakeshop DB or
        # from module docstrings, and hand edits to them are silently discarded
        # by the next render. `--check` writes nothing; it fails when a
        # committed copy no longer matches what its generator produces, naming
        # the stale file. Kanban Pages publishes FRESHLY rendered copies of the
        # first three, so without this gate the published board and the
        # committed board can disagree with nothing reporting it. The step stops
        # at the first stale file.
        run: |
          uv run python scripts/build_kanban_md.py --check
          uv run python scripts/build_kanban_html.py --check
          uv run python scripts/build_glossary_md.py --check
          uv run python scripts/build_tree_md.py --check

  test:
    name: Python ${{ matrix.python }} - Django ${{ matrix.django }} - ${{ matrix.database }}${{ matrix.compatibility_only == '1' && ' [compatibility floor]' || '' }} - ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Inherits the workflow-level `contents: read`. This job used to grant
    # `contents: write`; the only token consumer is the Coveralls upload (now in
    # the `coverage` job), which authenticates a coverage report and never writes
    # to the repository, so the write scope was unused authority (spec-049
    # Decision 3).
    timeout-minutes: 45
    strategy:
      # If one version fails, don't stop the others
      fail-fast: false
      matrix:
        # Manual dispatch (workflow_dispatch) and the weekly schedule run the full
        # matrix AND exercise both the default single-DB settings and the sharded
        # fakeshop DATABASES layout (FAKESHOP_SHARDED=1) on every Python/Django
        # node — the multi-DB contract is gated only at those tiers so push/PR
        # feedback stays fast. Push/PR runs only the minimum-support combo and the latest combo,
        # single-DB only (covers both ends without doubling CI wall-clock).
        #
        # Every node runs as two `shard` jobs on separate runners, because one
        # runner's four workers no longer finish the suite inside the timeout.
        # `library-keyset` is the two largest live-API modules, which together
        # take about half the suite's time; `remainder` is everything else. The
        # run step below maps each shard to its paths.
        #
        # `compatibility_only: "1"` marks the exact-Django-5.2.16 nodes. They
        # prove the ADVERTISED API FLOOR still imports and behaves -- a
        # compatibility contract. 5.2.16 is itself a patched release -- it
        # carries the security fixes the earlier 5.2.x releases lack -- so this
        # cell installs nothing under a published advisory today. That
        # does NOT make the cell a secure-deployment statement: a floor is a
        # point-in-time API claim, and the next Django security release makes it
        # older than the newest patch again. So the label stays -- this cell must
        # never be cited as a supported deployment target, copied into a
        # deployment example, or used to argue that pinning the floor exactly is
        # a safe deployment choice. Compatibility support and secure-deployment
        # support are different contracts (spec-049 Decision 2). The dependency
        # audit scans the `uv.lock` resolution, never this pinned-floor
        # environment, so the cell cannot turn the audit red either
        # (spec-049 Decision 5).
        #
        # The minimum-support nodes (Django 5.2.16 / Python 3.10) also
        # force-install exactly strawberry-graphql==0.322.2 so the advertised
        # floor (the first release that bounds a `first` + `before` connection
        # page at its cursor, and past spec-044 Decision 6's per-operation
        # extension isolation) is durably exercised on every push/PR,
        # coverage-free (the latest node keeps the coverage gate). They then
        # install every soft dependency at its floor (the step after it).
        # tests/test_ci_governance.py holds each floor literal in this file to
        # its pyproject.toml lower bound.
        include: >-
          ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && fromJSON('[
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "library-keyset"},
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "remainder"},
            {"django": "5.2.16", "python": "3.10", "database": "multi DB", "fakeshop_sharded": "1", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "library-keyset"},
            {"django": "5.2.16", "python": "3.10", "database": "multi DB", "fakeshop_sharded": "1", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.11", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.11", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.11", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.11", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "5.2.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "5.2.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "6.0.*", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "6.0.*", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "6.1.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "6.1.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "6.1.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "6.1.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "6.1.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "library-keyset"},
            {"django": "6.1.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0", "shard": "remainder"},
            {"django": "6.1.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "6.1.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1", "shard": "library-keyset"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1", "shard": "remainder"},
            {"django": "latest", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1", "shard": "library-keyset"},
            {"django": "latest", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1", "shard": "remainder"}
          ]') || fromJSON('[
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "library-keyset"},
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.322.2", "compatibility_only": "1", "shard": "remainder"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1", "shard": "library-keyset"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1", "shard": "remainder"}
          ]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; the Coveralls upload authenticates with
          # GITHUB_TOKEN from the step env, not with the checkout credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # One cache per matrix node: nodes sharing a Python (e.g. several 3.12
          # combos on a full dispatch) would otherwise share a key and race / thrash.
          cache-suffix: test-${{ matrix.python }}-${{ matrix.django }}-${{ matrix.fakeshop_sharded }}

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Install Django ${{ matrix.django }}
        # ``--upgrade-package Django`` is not redundant with the pin beside it:
        # a bare constraint is a no-op whenever the synced version already
        # satisfies it, so ``Django==5.2.*`` resolves to the newest 5.2 patch on
        # Python 3.12+ (where uv.lock gives 6.x) but leaves 3.11 on its locked
        # 5.2 patch -- one matrix label, two versions under test. Scoping the
        # upgrade to Django alone, rather than a bare ``--upgrade``, keeps every
        # transitive pin at its uv.lock version.
        run: |
          if [ "${{ matrix.django }}" == "latest" ]; then
            uv pip install --upgrade-package Django "Django"
          else
            uv pip install --upgrade-package Django "Django==${{ matrix.django }}"
          fi
          uv run --no-sync django-admin --version

      - name: Install Strawberry ${{ matrix.strawberry }} (minimum supported floor)
        # Only the minimum-support nodes pin the exact floor; the other nodes run
        # the uv.lock-resolved (latest compatible) strawberry-graphql. Recording
        # the resolved version makes the exercised floor auditable in the log.
        #
        # Both ends are load-bearing, and the TOP end is the one that is easy to
        # lose: the WebSocket transport wraps whichever schema attribute upstream's
        # protocol handlers dispatch an operation's results through, and upstream
        # has renamed that attribute before (0.319.0 moved graphql-transport-ws
        # from `subscribe` + `execute` to `stream`). An
        # unwrapped rename is silent -- the delegating wrapper forwards it to the
        # real schema and the protocol keeps working, minus the masking and the
        # revocation stop. `tests/test_routers.py` re-derives the read set from the
        # INSTALLED handler modules and fails on a name the wrapper does not cover,
        # so what protects consumers is that some node runs the top of the range:
        # a stale `uv.lock` makes every unpinned node another floor run and the
        # tripwire silent. Dependabot's weekly `uv` PR is what keeps the lock at the
        # top (.github/dependabot.yml), and that PR going red IS the intended
        # notification -- do not pin strawberry-graphql on the coverage node to
        # float, which would move the alarm onto main.
        if: matrix.strawberry
        run: |
          uv pip install "strawberry-graphql==${{ matrix.strawberry }}"
          uv run --no-sync python -c "import importlib.metadata as m; print('strawberry-graphql', m.version('strawberry-graphql'))"

      - name: Install the soft dependencies at their floors (minimum supported floor)
        # channels[daphne], cryptography, django-debug-toolbar and
        # djangorestframework are never in [project].dependencies; the floor each
        # one supports is the `>=` bound of its [dependency-groups].dev row in
        # pyproject.toml, and `uv sync` resolves the newer release uv.lock
        # carries. The minimum-support nodes replace each with that exact floor,
        # so the whole suite runs every soft-dependency path at it; the other
        # nodes run the locked releases. The second line records the versions.
        if: matrix.compatibility_only == '1'
        run: |
          uv pip install "channels[daphne]==4.3.2" "cryptography==44.0.0" "django-debug-toolbar==7.0.0" "djangorestframework==3.17.0"
          uv pip show channels cryptography django-debug-toolbar djangorestframework

      - name: Run Tests (${{ matrix.database }}, ${{ matrix.shard }})
        # The latest single-DB node's two shards trace coverage; the `coverage`
        # job below combines them and owns the fail_under=100 gate and the
        # Coveralls upload, so a shard reports nothing and fails under nothing.
        # Compatibility nodes run the identical test selection without tracing
        # it again: Coverage.py 7.14 uses its fast sys.monitoring core on Python
        # 3.14, while Python <=3.13 must use the much slower sys.settrace core.
        # `-o addopts` replaces pytest.ini's addopts wholesale, so the
        # compatibility branch drops --cov without --no-cov's warning.
        #
        # `library-keyset` spreads single tests across the workers (`load`), as
        # the Postgres tier does for the live-API modules: each module is too
        # large for one worker. `remainder` keeps `loadscope`, which the package
        # tests' global-registry fixtures require.
        env:
          FAKESHOP_SHARDED: ${{ matrix.fakeshop_sharded }}
        run: |
          live=examples/fakeshop/test_query
          if [ "${{ matrix.shard }}" = "library-keyset" ]; then
            addopts="-v -n auto --dist load --durations=25"
            targets="$live/test_library_api.py $live/test_keyset_api.py"
          else
            addopts="-v -n auto --dist loadscope --durations=25"
            targets="--ignore=$live/test_library_api.py --ignore=$live/test_keyset_api.py"
          fi
          if [ "${{ matrix.coverage }}" = "1" ]; then
            addopts="$addopts --cov --cov-report= --cov-fail-under=0"
          fi
          uv run --no-sync pytest -o addopts="$addopts" $targets

      - name: Keep the shard's coverage data
        if: matrix.coverage == '1'
        run: mv .coverage ".coverage.${{ matrix.shard }}"

      - name: Upload the shard's coverage data
        if: matrix.coverage == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # Combines the coverage node's two shards into one report and gates it at
    # fail_under=100. Every shard runs from the same checkout path on the same
    # runner image, so the recorded file paths combine as they stand.
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; the Coveralls upload authenticates with
          # GITHUB_TOKEN from the step env, not with the checkout credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: coverage

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14

      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run --no-sync coverage combine .coverage.library-keyset .coverage.remainder
          uv run --no-sync coverage report

      - name: Upload Coverage to Coveralls
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv pip install coveralls
          uv run --no-sync coveralls
