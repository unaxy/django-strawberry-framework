name: Postgres CI

# Manual and weekly tier. The Postgres suite spins up a real Postgres server and
# re-runs the DB-touching tests against it, which is resource-heavy, so it is
# gated behind workflow_dispatch (the "Run workflow" button) and a weekly
# schedule rather than firing on every push / pull_request like Django CI does.
on:
  workflow_dispatch:
  schedule:
    # 05:53 UTC every Monday, beside Django CI's weekly full matrix: Django
    # latest installs on every run, so a Django release that breaks a Postgres
    # path surfaces within a week even when no commit dispatches this tier.
    - cron: "53 5 * * 1"

# Least privilege: this tier only reads the repository (spec-049 Decision 3).
permissions:
  contents: read

jobs:
  test-postgres:
    # The Postgres tier: the DB-touching tests (@pytest.mark.django_db and
    # @pytest.mark.pg) re-run against a real Postgres server via the
    # FAKESHOP_PG_DSN settings branch, to prove vendor portability of the ORM /
    # SQL paths -- including @pytest.mark.pg tests such as the LATERAL
    # nested-fetch strategy that only make sense on Postgres. Pure-unit tests
    # never open a connection, so they are vendor-agnostic and are NOT re-run
    # here (see the `-m` filter on the test step). The sqlite tier (django.yml)
    # runs the whole suite and owns the fail_under=100 coverage gate on every
    # push/PR.
    name: Postgres - Python 3.14 - Django latest - ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `scripts/postgres_shards.py` owns each shard's paths: the run step asks
        # it for them, and it fails the job unless every test module belongs to
        # exactly one shard. `other-live-*` split the remaining live-API modules
        # by their measured Postgres time (`scripts/postgres_shard_weights.json`);
        # `tests/test_postgres_shards.py` pins that these rows name exactly the
        # script's shards.
        include:
          - shard: library-api
            distribution: load --maxschedchunk=1
          - shard: products-api
            distribution: load --maxschedchunk=1
          - shard: other-live-1
            distribution: load
          - shard: other-live-2
            distribution: load
          - shard: other-live-3
            distribution: load
          - shard: package-core
            distribution: loadscope
          - shard: example-non-live
            distribution: loadscope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual tier, but the rule is uniform: no job here pushes, so the
          # checkout credential is never persisted into .git/config.
          persist-credentials: false
      # Launch Postgres FIRST, detached, so its image pull + boot overlap the
      # uv / dependency / Django-install steps below -- by the time the tests
      # need it, it is already healthy (the "Wait" step usually returns on the
      # first poll). Tuned throwaway server: fsync / synchronous_commit /
      # full_page_writes off + a tmpfs data dir -- durability we don't need,
      # traded for a faster write-heavy setup phase (12 workers each createdb +
      # replay migrations, then factories insert fixtures). GitHub's `services:`
      # syntax can't pass these server args, which is why it runs as a step.
      #
      # The image is pinned by DIGEST, not by the `postgres:16` tag: a tag is
      # mutable, so `postgres:16` silently becomes a different image on every
      # upstream 16.x rebuild and the tier's server is then unreviewed
      # (spec-049 Decision 4). The digest below is `postgres:16` as resolved from
      # the Docker Hub registry manifest API; refresh it deliberately, in its own
      # change, resolved the same way, never by hand.
      - name: Start tuned throwaway Postgres (digest-pinned)
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=fakeshop \
            -e POSTGRES_PASSWORD=fakeshop \
            -e POSTGRES_DB=fakeshop \
            -p 5432:5432 \
            --tmpfs /var/lib/postgresql/data \
            --health-cmd "pg_isready -U fakeshop" \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 15 \
            postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: test-postgres
      - name: Set up Python 3.14
        run: uv python install 3.14
      - name: Install dependencies with latest Django
        # No ``--locked``: ``--upgrade-package Django`` re-resolves Django on purpose,
        # so ``--locked`` would fail the run whenever a Django release is newer than
        # the lock. ``uv lock --check`` first fails the run when ``pyproject.toml``
        # and ``uv.lock`` disagree. A newer Django also moves every pin its
        # requirements force up (e.g. asgiref, sqlparse), directly or through
        # another package's bound, to its newest compatible release; every pin
        # it does not force stays at its uv.lock version.
        run: |
          uv lock --check
          uv sync --python 3.14 --group pg --upgrade-package Django
          uv run --no-sync django-admin --version
      - name: Wait for Postgres to be healthy
        # Postgres has been booting since right after checkout (while the deps
        # installed), so this usually passes on the first poll.
        run: |
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' postgres 2>/dev/null || true)
            echo "  health: ${health:-<none>}"
            [ "$health" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::Postgres did not become healthy in time"
          docker logs postgres || true
          exit 1
      - name: Run Tests (Postgres)
        # Two overrides vs the pytest.ini defaults, both carried by a single
        # `-o addopts=...`, which REPLACES the ini `addopts` wholesale -- so we
        # re-list the flags we keep. Every other ini key (testpaths,
        # filterwarnings=error, asyncio_mode, markers) is a separate option and
        # stays in force.
        #
        # 1. Path-disjoint matrix shards run on independent runners and
        #    Postgres servers; `scripts/postgres_shards.py paths` prints a
        #    shard's paths after checking the partition (the assignment fails
        #    the step under the shell's errexit). The live-API shards use `load`
        #    so individual tests can fill all workers; package shards retain
        #    `loadscope` because their global-registry fixtures require it.
        #
        # 2. `-n 12` instead of `-n auto` (= 4 on a standard ubuntu-latest):
        #    this tier is I/O-bound -- every test round-trips to a real Postgres
        #    server over TCP, so workers spend most of their time WAITING on the
        #    DB, not the CPU. Over-subscribing past the core count lets one
        #    worker's query run while another blocks on I/O. 12 is a starting
        #    point (3x cores; well under Postgres' default max_connections=100)
        #    -- dial it against measured runs; too high and per-worker test-DB
        #    creation + migration replay starts to dominate.
        #
        # 3. `--cov`/`--cov-report` dropped: coverage is redundant on this tier.
        #    The sqlite tier (django.yml) already enforces fail_under=100 on
        #    every push/PR, and the code is structured so no line is
        #    Postgres-only-reachable -- coverage is vendor-identical, so
        #    re-tracing it here only adds per-line + per-worker-combine overhead.
        #    This job's contract is "does the suite PASS on Postgres", not
        #    "re-measure coverage". (We strip `--cov` via addopts rather than
        #    passing `--no-cov`, which would emit a warning that
        #    filterwarnings=error turns into a failure.)
        #
        # 4. `-m "django_db or pg"`: only the DB-touching tests re-run here.
        #    Pure-unit tests never open a connection, so running them against
        #    Postgres proves nothing about vendor portability -- they are fully
        #    covered on the sqlite tier. Audited: every DB test carries the
        #    django_db or pg marker (including tests that also take DB access
        #    from a fixture), so nothing DB-touching is dropped. Cuts the tier
        #    down to roughly a third of the suite.
        env:
          FAKESHOP_PG_DSN: postgres://fakeshop:fakeshop@127.0.0.1:5432/fakeshop
          SHARD: ${{ matrix.shard }}
        run: |
          targets="$(uv run --no-sync python scripts/postgres_shards.py paths "$SHARD")"
          # The script refuses a path holding whitespace, so word splitting is exact.
          # shellcheck disable=SC2086
          uv run --no-sync pytest \
            -o addopts="-v -n 12 --dist ${{ matrix.distribution }} --durations=25" \
            -m "django_db or pg" \
            $targets
